<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Biodata diri menggunakan HTML5 Semantic Tags dengan animasi kelompok stickman perang">
    <title>Biodata</title>
    <style>
        /* Mengatur font dan background seluruh halaman */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            overflow: hidden; /* Mencegah scrollbar muncul akibat animasi */
            position: relative;
        }

        /* Wadah utama (Card) - Menggunakan tag <main> */
        .card {
            background: rgba(255, 255, 255, 0.95); /* Kotak putih solid, tidak blur */
            max-width: 450px;
            width: 90%;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 2; /* Berada di bawah animasi */
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Reset margin untuk tag <figure> */
        figure {
            margin: 0 0 15px 0;
            padding: 0;
        }

        /* Foto Profil */
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #9b59b6;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Nama dan Pekerjaan di dalam <header> */
        h1 {
            font-size: 24px;
            margin: 10px 0 5px 0;
            color: #2c3e50;
        }

        p.title {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 0 0 20px 0;
        }

        /* Tabel Detail Biodata di dalam <section> */
        .biodata-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: left;
        }

        .biodata-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #eee;
            font-size: 15px;
        }

        .biodata-table td.label {
            font-weight: bold;
            color: #9b59b6;
            width: 35%;
        }

        /* Bagian Pemutar Musik di dalam <footer> */
        .music-container {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #eee;
        }

        .music-title {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            display: block;
        }

        audio {
            width: 100%;
            outline: none;
        }

        /* ================= ANIMASI STICKMAN PERANG BERSENJATA ================= */
        .animation-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none; /* Agar tidak mengganggu interaksi mouse */
            z-index: 3; /* Membuat stickman berjalan menembus di atas kotak putih */
        }

        .stickman-group {
            position: absolute;
            bottom: 30%; /* Mengatur ketinggian posisi berbaris melintasi card */
            left: -320px; /* Mulai jauh di luar layar kiri agar barisan tidak patah */
            opacity: 0.65; /* Efek transparan/tembus pandang */
            animation: jalanMaju 16s linear infinite;
        }

        /* Animasi Pergerakan dari Kiri ke Kanan */
        @keyframes jalanMaju {
            0% {
                transform: translateX(0px);
            }
            100% {
                transform: translateX(calc(100vw + 350px));
            }
        }
    </style>
</head>
<body>

    <main class="card">
        
        <header>
            <figure>
                <img src="image.jpg" alt="Foto Profil" class="profile-img">
            </figure>
            
            <h1>Gunawan Cahya Ramadhan</h1>
            <p class="title">Web Developer / Pelajar</p>
        </header>
        
        <section>
            <table class="biodata-table">
                <tr>
                    <td class="label">Panggilan</td>
                    <td>GUGUN</td>
                </tr>
                <tr>
                    <td class="label">PRODI</td>
                    <td>TEKNOLOGI INFORMASI</td>
                </tr>
                <tr>
                    <td class="label">Alamat</td>
                    <td>Bitung Jaya,Cikupa</td>
                </tr>
                <tr>
                    <td class="label">Hobi</td>
                    <td>Coding, Membaca, Mendengar Musik</td>
                </tr>
            </table>
        </section>

        <footer class="music-container">
            <span class="music-title">🎵 Now Playing: Backsound Santai</span>
            <audio controls autoplay loop>
                <source src="lagu-kamu.mp3" type="audio/mpeg">
                Browser kamu tidak mendukung pemutar musik HTML5.
            </audio>
        </footer>

    </main>

    <div class="animation-container">

                <line x1="10" y1="12" x2="26" y2="13" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>
                
                <path d="M10,25 L4,38 L1,48" stroke="#2c3e50" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <path d="M10,25 L15,36 L18,48" stroke="#2c3e50" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <path d="M5,-1 Q10,-6 15,-1 Z" fill="#2c3e50"/>
                <rect x="4" y="8" width="5" height="10" fill="#2c3e50" rx="1"/>
            </g>

            <g transform="translate(160, 40)">
                <line x1="22" y1="-15" x2="22" y2="30" stroke="#2c3e50" stroke-width="2.5"/> <polygon points="22,-22 19,-15 25,-15" fill="#2c3e50"/> <polygon points="22,-12 37,-7 22,-2" fill="#9b59b6"/> <circle cx="10" cy="0" r="5" fill="#2c3e50"/>
                <line x1="10" y1="5" x2="10" y2="25" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
                
                <line x1="10" y1="10" x2="22" y2="8" stroke="#2c3e50" stroke-width="2"/>
                
                <path d="M10,25 L6,35 L12,48" stroke="#2c3e50" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M10,25 L13,37 L9,48" stroke="#2c3e50" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                
                <rect x="4" y="7" width="5" height="11" fill="#2c3e50" rx="1"/>
            </g>

            <g transform="translate(100, 40)">
                <line x1="-2" y1="3" x2="-12" y2="-5" stroke="#2c3e50" stroke-width="2.5" stroke-linecap="round"/> <line x1="-10" y1="-2" x2="-6" y2="-6" stroke="#2c3e50" stroke-width="2"/> <rect x="16" y="4" width="10" height="20" rx="2" fill="#a5a5a5" stroke="#2c3e50" stroke-width="2"/> <circle cx="10" cy="0" r="5" fill="#2c3e50"/>
                <line x1="10" y1="5" x2="10" y2="25" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
                
                <line x1="10" y1="9" x2="-2" y2="5" stroke="#2c3e50" stroke-width="2"/> <line x1="10" y1="11" x2="17" y2="12" stroke="#2c3e50" stroke-width="2"/> <path d="M10,25 L3,36 L0,48" stroke="#2c3e50" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M10,25 L14,35 L19,48" stroke="#2c3e50" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                
                <path d="M5,-1 Q10,-6 15,-1 Z" fill="#2c3e50"/> <rect x="4" y="8" width="5" height="10" fill="#2c3e50" rx="1"/>
            </g>

            <g transform="translate(40, 40)">
                <path d="M5,15 L25,-5 M20,-1 L22,-4 M7,13 L5,16" stroke="#2c3e50" stroke-width="2.5" fill="none"/> 

                <circle cx="10" cy="0" r="5" fill="#2c3e50"/>
                <line x1="10" y1="5" x2="10" y2="25" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
                
                <line x1="10" y1="10" x2="14" y2="5" stroke="#2c3e50" stroke-width="2"/>
                
                <path d="M10,25 L7,37 L13,48" stroke="#2c3e50" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M10,25 L12,35 L8,48" stroke="#2c3e50" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                
                <rect x="4" y="8" width="5" height="11" fill="#2c3e50" rx="1"/>
            </g>

        </svg>
    </div>

</body>
</html>
